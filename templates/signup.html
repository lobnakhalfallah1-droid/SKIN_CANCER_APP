<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>DermaVision — Création de compte</title>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        :root {
            --bg1: #EFE9E1;
            --bg2: #E7D9CC;
            --card: rgba(255, 250, 245, 0.82);
            --border: rgba(143, 95, 74, 0.25);
            --accent: #B8876B;
            --accent-2: #8F5F4A;
            --text: #3B2F2A;
            --muted: #75655D;
            --input-bg: #FFF8F2;
            --input-text: #3B2F2A;
            --danger: #E57386;
            --warning: #E0A93B;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            height: 100%;
            overflow: hidden;
        }

        body {
            width: 100%;
            height: 100vh;
            max-height: 100vh;
            font-family: 'DM Sans', sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 20% 20%, rgba(184, 135, 107, 0.22), transparent 28%),
                radial-gradient(circle at 80% 80%, rgba(143, 95, 74, 0.18), transparent 30%),
                linear-gradient(135deg, var(--bg1), var(--bg2));
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            overflow: hidden;
            position: relative;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            width: 2px;
            height: 120%;
            top: -10%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.75;
        }

        body::before {
            left: 22%;
            background: linear-gradient(
                to bottom,
                transparent,
                rgba(184, 135, 107, 0.75),
                transparent
            );
            box-shadow: 0 0 22px rgba(184, 135, 107, 0.42);
            animation: moveLineV1 5s ease-in-out infinite alternate;
        }

        body::after {
            right: 22%;
            background: linear-gradient(
                to bottom,
                transparent,
                rgba(143, 95, 74, 0.72),
                transparent
            );
            box-shadow: 0 0 22px rgba(143, 95, 74, 0.38);
            animation: moveLineV2 6s ease-in-out infinite alternate;
        }

        .bg-line-h1,
        .bg-line-h2 {
            position: fixed;
            left: -10%;
            width: 120%;
            height: 2px;
            pointer-events: none;
            z-index: 0;
            opacity: 0.72;
        }

        .bg-line-h1 {
            top: 22%;
            background: linear-gradient(
                to right,
                transparent,
                rgba(184, 135, 107, 0.70),
                transparent
            );
            box-shadow: 0 0 22px rgba(184, 135, 107, 0.38);
            animation: moveLineH1 5.5s ease-in-out infinite alternate;
        }

        .bg-line-h2 {
            bottom: 22%;
            background: linear-gradient(
                to right,
                transparent,
                rgba(143, 95, 74, 0.68),
                transparent
            );
            box-shadow: 0 0 22px rgba(143, 95, 74, 0.34);
            animation: moveLineH2 6.5s ease-in-out infinite alternate;
        }

        @keyframes moveLineV1 {
            from { transform: translateX(-30px) rotate(4deg); }
            to   { transform: translateX(30px) rotate(4deg); }
        }

        @keyframes moveLineV2 {
            from { transform: translateX(30px) rotate(-4deg); }
            to   { transform: translateX(-30px) rotate(-4deg); }
        }

        @keyframes moveLineH1 {
            from { transform: translateY(-18px); }
            to   { transform: translateY(18px); }
        }

        @keyframes moveLineH2 {
            from { transform: translateY(18px); }
            to   { transform: translateY(-18px); }
        }

        .signup-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 860px;
            animation: fadeUp 0.6s ease forwards;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .signup-card {
            width: 100%;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 26px;
            padding: 1.35rem 1.5rem;
            box-shadow:
                0 30px 80px rgba(77, 53, 43, 0.16),
                inset 0 1px 0 rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            overflow: hidden;
        }

        .brand {
            margin-bottom: 0.9rem;
            text-align: left;
        }

        .brand-logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 0.45rem;
        }

        .brand-logo-container i {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            background: rgba(184, 135, 107, 0.16);
            border: 1px solid rgba(184, 135, 107, 0.35);
            color: #8F5F4A;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(184, 135, 107, 0.16);
            border: 1px solid rgba(184, 135, 107, 0.35);
            border-radius: 999px;
            padding: 6px 14px;
            font-size: 0.72rem;
            color: #8F5F4A;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-weight: 800;
            margin-bottom: 0.8rem;
        }

        .brand-badge span {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 14px rgba(184, 135, 107, 0.70);
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.45;
                transform: scale(0.78);
            }
        }

        .brand h1 {
            font-family: 'Syne', sans-serif;
            font-size: 2.15rem;
            font-weight: 800;
            line-height: 1;
            color: var(--text);
            letter-spacing: -0.06em;
            margin-bottom: 0;
        }

        .brand h1 em {
            color: var(--accent-2);
            font-style: normal;
            text-shadow: 0 0 18px rgba(143, 95, 74, 0.34);
        }

        .brand p {
            color: var(--muted);
            font-size: 0.94rem;
            font-weight: 500;
        }

        .divider {
            height: 1px;
            background: linear-gradient(
                to right,
                transparent,
                rgba(184, 135, 107, 0.35),
                transparent
            );
            margin: 0.8rem 0 1rem;
        }

        .alert {
            border-radius: 14px !important;
            font-size: 0.9rem;
            padding: 0.75rem 0.95rem !important;
            margin-bottom: 0.9rem;
            border: 1px solid transparent !important;
        }

        .alert-danger {
            background: rgba(229, 115, 134, 0.14) !important;
            color: #9F354C !important;
            border-color: rgba(229, 115, 134, 0.30) !important;
        }

        .alert-success,
        .alert-info {
            background: rgba(184, 135, 107, 0.16) !important;
            color: #8F5F4A !important;
            border-color: rgba(184, 135, 107, 0.35) !important;
        }

        .alert-warning {
            background: rgba(224, 169, 59, 0.15) !important;
            color: #8A650F !important;
            border-color: rgba(224, 169, 59, 0.30) !important;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem 1rem;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .form-label {
            font-size: 0.76rem;
            font-weight: 800;
            color: var(--text);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 0.4rem;
            display: block;
        }

        .form-control,
        .form-select {
            background: var(--input-bg) !important;
            border: 1px solid rgba(184, 135, 107, 0.32) !important;
            border-radius: 14px !important;
            color: var(--input-text) !important;
            padding: 0.72rem 0.95rem !important;
            font-size: 0.95rem !important;
            font-family: 'DM Sans', sans-serif !important;
            transition: all 0.22s ease;
            min-height: 48px;
            box-shadow: 0 8px 20px rgba(77, 53, 43, 0.03);
        }

        .form-control::placeholder {
            color: rgba(77, 53, 43, 0.50) !important;
        }

        .form-control:focus,
        .form-select:focus {
            outline: none !important;
            border-color: var(--accent) !important;
            box-shadow: 0 0 0 4px rgba(184, 135, 107, 0.18) !important;
            background: #FFFFFF !important;
        }

        .btn-signup {
            width: 100%;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #FFFFFF;
            border: none;
            border-radius: 16px;
            padding: 0.88rem 1.1rem;
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 1.04rem;
            letter-spacing: 0.02em;
            cursor: pointer;
            margin-top: 0.35rem;
            box-shadow: 0 14px 35px rgba(184, 135, 107, 0.28);
            transition: all 0.22s ease;
        }

        .btn-signup:hover {
            transform: translateY(-2px);
            box-shadow: 0 18px 45px rgba(143, 95, 74, 0.32);
            filter: brightness(1.04);
        }

        .btn-signup:active {
            transform: translateY(0);
            box-shadow: none;
        }

        .login-hint {
            text-align: center;
            font-size: 0.9rem;
            color: var(--muted);
            margin-top: 0.95rem;
        }

        .login-hint a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 800;
        }

        .login-hint a:hover {
            text-decoration: underline;
        }

        #role_custom_group {
            display: none;
        }

        @media (max-width: 768px) {
            html, body {
                overflow-y: auto;
            }

            body {
                height: auto;
                min-height: 100vh;
                padding: 14px;
            }

            .signup-wrapper {
                max-width: 100%;
            }

            .signup-card {
                padding: 1.25rem 1rem;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: auto;
            }

            .brand h1 {
                font-size: 1.9rem;
            }

            body::before {
                left: 10%;
            }

            body::after {
                right: 10%;
            }

            .bg-line-h1 {
                top: 16%;
            }

            .bg-line-h2 {
                bottom: 16%;
            }
        }
    </style>
</head>

<body>
    <div class="bg-line-h1"></div>
    <div class="bg-line-h2"></div>

    <div class="signup-wrapper">
        <div class="signup-card">

            <div class="brand">
                <div class="brand-badge">
                    <span></span>
                    Nouveau compte
                </div>

                <div class="brand-logo-container">
                    <i><span class="bi bi-shield-plus"></span></i>
                    <h1>Derma<em>Vision</em></h1>
                </div>
                <p>Créez votre accès au système de diagnostic</p>
            </div>

            <div class="divider"></div>

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% for cat, msg in messages %}
                <div class="alert alert-{{ cat }}">
                    {{ msg }}
                </div>
              {% endfor %}
            {% endwith %}

            <form method="POST" action="/signup">
                <div class="form-grid">

                    <div>
                        <label class="form-label">Prénom</label>
                        <input
                            type="text"
                            name="first_name"
                            class="form-control"
                            placeholder="Prénom"
                            value="{{ request.form.get('first_name', '') }}"
                            required>
                    </div>

                    <div>
                        <label class="form-label">Nom</label>
                        <input
                            type="text"
                            name="last_name"
                            class="form-control"
                            placeholder="Nom"
                            value="{{ request.form.get('last_name', '') }}"
                            required>
                    </div>

                    <div>
                        <label class="form-label">Identifiant</label>
                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            placeholder="Choisissez un identifiant"
                            value="{{ request.form.get('username', '') }}"
                            required>
                    </div>

                    <div>
                        <label class="form-label">Adresse e-mail</label>
                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            placeholder="exemple@hopital.fr"
                            value="{{ request.form.get('email', '') }}"
                            required>
                    </div>

                    <div>
                        <label class="form-label">Rôle</label>
                        <select name="role" id="role" class="form-select" onchange="toggleCustomRole()" required>
                            <option value="" disabled {% if not request.form.get('role') %}selected{% endif %}>Sélectionnez votre rôle</option>
                            <option value="Médecin" {% if request.form.get('role') == 'Médecin' %}selected{% endif %}>Médecin</option>
                            <option value="Dermatologue" {% if request.form.get('role') == 'Dermatologue' %}selected{% endif %}>Dermatologue</option>
                            <option value="Infirmier" {% if request.form.get('role') == 'Infirmier' %}selected{% endif %}>Infirmier</option>
                            <option value="Administrateur" {% if request.form.get('role') == 'Administrateur' %}selected{% endif %}>Administrateur</option>
                            <option value="autre" {% if request.form.get('role') == 'autre' %}selected{% endif %}>Autre</option>
                        </select>
                    </div>

                    <div id="role_custom_group">
                        <label class="form-label">Précisez le rôle</label>
                        <input
                            type="text"
                            name="role_custom"
                            id="role_custom"
                            class="form-control"
                            placeholder="Ex: Interne, Technicien..."
                            value="{{ request.form.get('role_custom', '') }}">
                    </div>

                    <div>
                        <label class="form-label">Mot de passe</label>
                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            placeholder="Minimum 8 caractères"
                            required>
                    </div>

                    <div>
                        <label class="form-label">Confirmer le mot de passe</label>
                        <input
                            type="password"
                            name="confirm_password"
                            class="form-control"
                            placeholder="Répétez le mot de passe"
                            required>
                    </div>

                    <div class="full-width">
                        <button type="submit" class="btn-signup">
                            Créer mon compte →
                        </button>
                    </div>

                </div>
            </form>

            <p class="login-hint">
                Vous avez déjà un compte ?
                <a href="/login">Se connecter</a>
            </p>

        </div>
    </div>

    <script>
        function toggleCustomRole() {
            const roleSelect = document.getElementById("role");
            const customGroup = document.getElementById("role_custom_group");
            const customInput = document.getElementById("role_custom");

            if (roleSelect.value === "autre") {
                customGroup.style.display = "block";
                customInput.setAttribute("required", "required");
            } else {
                customGroup.style.display = "none";
                customInput.removeAttribute("required");
                customInput.value = "";
            }
        }

        window.addEventListener("load", function () {
            toggleCustomRole();
        });
    </script>
</body>
</html>
