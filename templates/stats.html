<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>DermaVision — Statistiques</title>
    
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg: #EFE9E1;
            --bg-2: #E7D9CC;
            --card: #FFF8F2;
            --sidebar: #E7D9CC;
            --border: rgba(143, 95, 74, 0.22);
            --accent: #B8876B;
            --accent-2: #8F5F4A;
            --accent-dim: rgba(184, 135, 107, 0.16);
            --text: #3B2F2A;
            --muted: #75655D;
        }

        body {
            background: linear-gradient(135deg, var(--bg), var(--bg-2));
            font-family: 'DM Sans', sans-serif;
            color: var(--text);
            min-height: 100vh;
        }

        .custom-navbar {
            background: rgba(239, 233, 225, 0.88);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .brand-logo-small {
            font-family: 'Playfair Display', serif;
            font-weight: 800;
            font-size: 1.45rem;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .brand-logo-small i {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            background: var(--accent-dim);
            border: 1px solid var(--border);
            color: var(--accent-2) !important;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        .btn-back {
            background: white;
            color: var(--text);
            border: 1px solid var(--border);
            font-weight: 600;
            padding: 8px 16px;
            transition: all 0.2s;
        }

        .btn-back:hover {
            background: var(--accent-dim);
            color: var(--accent-2);
            border-color: var(--border);
        }

        .page-wrapper {
            padding: 40px 20px;
            max-width: 1000px;
        }

        .page-header {
            margin-bottom: 30px;
        }

        .page-header p {
            color: var(--accent-2);
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-size: 0.85rem;
            margin-bottom: 5px;
        }

        .page-header h2 {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 2.2rem;
            color: var(--text);
            margin-bottom: 0;
        }

        .page-header h2 span {
            color: var(--accent-2);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 10px 30px rgba(77, 53, 43, 0.05);
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background: var(--accent-dim);
            color: var(--accent-2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
        }

        .stat-info h4 {
            font-size: 0.9rem;
            color: var(--muted);
            margin-bottom: 5px;
            font-weight: 600;
        }

        .stat-info .stat-value {
            font-size: 1.8rem;
            font-weight: 800;
            font-family: 'DM Sans', sans-serif;
            color: var(--text);
            line-height: 1;
        }

        .chart-container {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(77, 53, 43, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .chart-title {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 1.3rem;
            margin-bottom: 25px;
            text-align: center;
        }

        .chart-wrapper {
            position: relative;
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1;
        }

    </style>
</head>
<body>
    <nav class="custom-navbar">
        <div class="container d-flex justify-content-between align-items-center">
            <div class="brand-logo-small">
                <i class="bi bi-shield-plus"></i>
                DermaVision
            </div>
            <a class="btn btn-back btn-sm rounded-pill px-3" href="/dashboard">
                <i class="bi bi-arrow-left me-1"></i>
                Retour au tableau de bord
            </a>
        </div>
    </nav>

    <div class="container page-wrapper">
        <div class="page-header">
            <p>Vue d'ensemble</p>
            <h2>Performances <span>& Statistiques</span></h2>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon"><i class="fa-solid fa-users"></i></div>
                <div class="stat-info">
                    <h4>Total Patients</h4>
                    <div class="stat-value">{{ total }}</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fa-solid fa-check-circle" style="color: #6da377;"></i></div>
                <div class="stat-info">
                    <h4>Cas Bénins</h4>
                    <div class="stat-value">{{ benign }}</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fa-solid fa-triangle-exclamation" style="color: #c76b6b;"></i></div>
                <div class="stat-info">
                    <h4>Cas Malins</h4>
                    <div class="stat-value">{{ malignant }}</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fa-solid fa-bullseye"></i></div>
                <div class="stat-info">
                    <h4>Confiance Moyenne</h4>
                    <div class="stat-value">{{ avg_confidence }}%</div>
                </div>
            </div>
        </div>

        <div class="chart-container">
            <div class="chart-title">Répartition des Diagnostics IA</div>
            <div class="chart-wrapper">
                <canvas id="diagnosticsChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('diagnosticsChart').getContext('2d');
        const benignCount = {{ benign }};
        const malignantCount = {{ malignant }};
        
        new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Bénin', 'Malin'],
                datasets: [{
                    data: [benignCount, malignantCount],
                    backgroundColor: [
                        '#8abf94', 
                        '#d98282'  
                    ],
                    borderColor: [
                        '#ffffff',
                        '#ffffff'
                    ],
                    borderWidth: 4,
                    hoverOffset: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                cutout: '70%',
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            font: {
                                family: "'DM Sans', sans-serif",
                                size: 14,
                                weight: '600'
                            },
                            padding: 20,
                            usePointStyle: true,
                            pointStyle: 'circle'
                        }
                    },
                    tooltip: {
                        backgroundColor: 'rgba(59, 47, 42, 0.9)',
                        titleFont: { family: "'DM Sans', sans-serif", size: 13 },
                        bodyFont: { family: "'DM Sans', sans-serif", size: 14, weight: 'bold' },
                        padding: 12,
                        cornerRadius: 8,
                        displayColors: true
                    }
                }
            }
        });
    </script>
</body>
</html>
