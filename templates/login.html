<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>DermaVision — Connexion</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        :root {
            --dark: #EFE9E1;
            --dark-2: #E7D9CC;
            --card: rgba(255, 250, 245, 0.82);
            --card-border: rgba(143, 95, 74, 0.25);

            --primary: #B8876B;
            --primary-2: #8F5F4A;
            --primary-3: #8F5F4A;

            --text: #3B2F2A;
            --muted: #75655D;

            --input-bg: #FFF8F2;
            --input-text: #3B2F2A;

            --danger: #E57386;
            --warning: #E0A93B;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(184, 135, 107, 0.22), transparent 32%),
                radial-gradient(circle at bottom right, rgba(143, 95, 74, 0.18), transparent 35%),
                linear-gradient(135deg, var(--dark), var(--dark-2));
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                linear-gradient(
                    90deg,
                    transparent 23%,
                    rgba(184, 135, 107, 0.40) 23.2%,
                    transparent 23.5%,
                    transparent 76%,
                    rgba(143, 95, 74, 0.36) 76.2%,
                    transparent 76.5%
                );
            animation: verticalMove 5s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background:
                linear-gradient(
                    0deg,
                    transparent 30%,
                    rgba(184, 135, 107, 0.30) 30.2%,
                    transparent 30.5%,
                    transparent 70%,
                    rgba(143, 95, 74, 0.28) 70.2%,
                    transparent 70.5%
                );
            animation: horizontalMove 6s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes verticalMove {
            from {
                transform: translateX(-25px);
            }
            to {
                transform: translateX(25px);
            }
        }

        @keyframes horizontalMove {
            from {
                transform: translateY(-18px);
            }
            to {
                transform: translateY(18px);
            }
        }

        .login-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 460px;
        }

        .login-card {
            width: 100%;
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 30px;
            padding: 34px 36px;
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            box-shadow:
                0 30px 90px rgba(77, 53, 43, 0.16),
                inset 0 1px 0 rgba(255, 255, 255, 0.55);
        }

        .brand {
            text-align: center;
            margin-bottom: 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .brand-logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .brand-logo-container i {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            background: rgba(184, 135, 107, 0.16);
            border: 1px solid rgba(184, 135, 107, 0.35);
            color: #8F5F4A;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 8px 17px;
            border-radius: 999px;
            background: rgba(184, 135, 107, 0.16);
            border: 1px solid rgba(184, 135, 107, 0.35);
            color: var(--primary-3);
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .brand-badge span {
            width: 9px;
            height: 9px;
            background: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 18px rgba(184, 135, 107, 0.70);
            animation: pulse 1.6s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(0.65);
                opacity: 0.45;
            }
        }

        .brand h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 0;
            letter-spacing: -0.04em;
            color: var(--text);
        }

        .brand h1 em {
            font-style: normal;
            color: var(--primary-2);
            text-shadow: 0 0 22px rgba(143, 95, 74, 0.34);
        }

        .brand p {
            color: var(--muted);
            font-size: 0.96rem;
            font-weight: 500;
        }

        .divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(184, 135, 107, 0.35),
                transparent
            );
            margin: 22px 0;
        }

        .alert-custom,
        .alert {
            border-radius: 16px !important;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 0.8rem 1rem !important;
            border: 1px solid transparent !important;
            margin-bottom: 16px;
        }

        .alert-danger {
            background: rgba(229, 115, 134, 0.14) !important;
            color: #9F354C !important;
            border-color: rgba(229, 115, 134, 0.30) !important;
        }

        .alert-success,
        .alert-info {
            background: rgba(184, 135, 107, 0.16) !important;
            color: #8F5F4A !important;
            border-color: rgba(184, 135, 107, 0.35) !important;
        }

        .alert-warning {
            background: rgba(224, 169, 59, 0.15) !important;
            color: #8A650F !important;
            border-color: rgba(224, 169, 59, 0.30) !important;
        }

        .form-label {
            color: var(--text);
            font-size: 0.76rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.09em;
            margin-bottom: 8px;
        }

        .custom-input {
            width: 100%;
            background: var(--input-bg) !important;
            color: var(--input-text) !important;
            border: 1px solid rgba(184, 135, 107, 0.32) !important;
            border-radius: 16px !important;
            padding: 13px 16px !important;
            font-size: 0.96rem !important;
            font-weight: 600;
            transition: 0.25s ease;
            box-shadow: 0 8px 20px rgba(77, 53, 43, 0.03);
        }

        .custom-input::placeholder {
            color: rgba(77, 53, 43, 0.50) !important;
            font-weight: 500;
        }

        .custom-input:focus {
            background: #FFFFFF !important;
            border-color: var(--primary) !important;
            box-shadow: 0 0 0 4px rgba(184, 135, 107, 0.18) !important;
            outline: none !important;
        }

        .btn-login {
            width: 100%;
            border: none;
            border-radius: 18px;
            padding: 14px 20px;
            margin-top: 4px;

            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            color: #FFFFFF;

            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 900;
            letter-spacing: 0.03em;

            cursor: pointer;
            box-shadow: 0 18px 45px rgba(184, 135, 107, 0.28);
            transition: 0.25s ease;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 22px 55px rgba(143, 95, 74, 0.32);
            filter: brightness(1.04);
        }

        .btn-login:active {
            transform: translateY(0);
            box-shadow: 0 10px 25px rgba(184, 135, 107, 0.25);
        }

        .signup-hint {
            margin-top: 20px;
            text-align: center;
            color: var(--muted);
            font-size: 0.92rem;
            font-weight: 500;
        }

        .signup-hint a {
            color: var(--primary);
            font-weight: 900;
            text-decoration: none;
        }

        .signup-hint a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .login-card {
                padding: 28px 24px;
                border-radius: 24px;
            }

            .brand h1 {
                font-size: 2.35rem;
            }
        }

        @media (max-height: 700px) {
            .login-card {
                padding: 24px 30px;
            }

            .brand {
                margin-bottom: 14px;
            }

            .brand h1 {
                font-size: 2.3rem;
            }

            .brand p {
                font-size: 0.88rem;
            }

            .divider {
                margin: 16px 0;
            }

            .custom-input {
                padding: 11px 15px !important;
            }

            .btn-login {
                padding: 12px 18px;
            }

            .signup-hint {
                margin-top: 14px;
            }
        }
    </style>
</head>

<body>
    <div class="login-wrapper">
        <div class="login-card">

            <div class="brand">
                <div class="brand-badge">
                    <span></span>
                    Système IA médical
                </div>

                <div class="brand-logo-container">
                    <i><span class="bi bi-shield-plus"></span></i>
                    <h1>Derma<em>Vision</em></h1>
                </div>

                <p>Connexion sécurisée à votre espace dermatologique intelligent</p>
            </div>

            <div class="divider"></div>

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% for cat, msg in messages %}
                <div class="alert alert-custom alert-{{ cat }}">
                    {{ msg }}
                </div>
              {% endfor %}
            {% endwith %}

            <form method="POST" action="/login">
                <div class="mb-3">
                    <label class="form-label">Identifiant</label>

                    <input
                        type="text"
                        name="username"
                        class="form-control custom-input"
                        placeholder="Entrez votre identifiant"
                        required
                        autocomplete="username">
                </div>

                <div class="mb-4">
                    <label class="form-label">Mot de passe</label>

                    <input
                        type="password"
                        name="password"
                        class="form-control custom-input"
                        placeholder="Entrez votre mot de passe"
                        required
                        autocomplete="current-password">
                </div>

                <button type="submit" class="btn-login">
                    Se connecter →
                </button>
            </form>

            <p class="signup-hint">
                Pas encore de compte ?
                <a href="/signup">Créer un compte</a>
            </p>

        </div>
    </div>
</body>
</html>
